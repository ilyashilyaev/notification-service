services:
  db:
    image: postgres:17-alpine
    container_name: notif-postgres
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: notifications
    ports:
      # Хост 5433 -> контейнер 5432: на 5432 уже висит локальный Postgres.
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d notifications"]
      interval: 2s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: notif-kafka
    ports:
      # Хост 9092 -> брокер. advertised = localhost:9092, так что клиент с хоста
      # (make run, тесты) и из контейнера (docker exec kafka-topics) идут в один адрес.
      - "9092:9092"
    environment:
      # Один узел в режиме KRaft: совмещает роли broker + controller, Zookeeper не нужен.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Пустой хост (":9092") = слушать на всех интерфейсах, но без литерала
      # 0.0.0.0: иначе format-шаг дефолтит advertised на 0.0.0.0 и падает.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # На одном узле всё реплицируется в один экземпляр.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: notif-redis
    ports:
      # Хост 6379 -> Redis. Используется для пер-юзер rate limit на POST /events.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
